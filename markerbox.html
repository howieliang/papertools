<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PaperPhicons – Paper Cut Cuboids</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { display: flex; height: 100vh; background: #555; font-family: Arial, sans-serif; font-size: 13px; color: #fff; }

  #sidebar {
    width: 180px; flex-shrink: 0;
    background: #222; padding: 12px 10px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; color: #aaa; margin-bottom: 2px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 11px; color: #aaa; }
  .field input[type=number] {
    width: 100%; padding: 3px 5px; background: #333; border: 1px solid #555;
    color: #fff; border-radius: 3px; font-size: 13px;
  }
  .field input[type=range] { width: 100%; }
  .toggle-row { display: flex; align-items: center; gap: 6px; }
  .toggle-row label { font-size: 11px; color: #aaa; }

  button {
    width: 100%; padding: 6px; border: none; border-radius: 3px;
    cursor: pointer; font-size: 12px; font-weight: bold;
  }
  #btnExportSVG { background: #2a6; color: #fff; }
  #btnExportSVG:hover { background: #3b7; }
  #btnExportCalib { background: #5a2; color: #fff; }
  #btnExportCalib:hover { background: #6b3; }
  #btnPrint { background: #37a; color: #fff; }
  #btnPrint:hover { background: #48b; }

  #status { font-size: 10px; color: #8a8; min-height: 14px; }

  #canvas-wrap {
    flex: 1; overflow: auto; display: flex;
    align-items: flex-start; justify-content: flex-start; padding: 10px;
  }
  canvas { display: block; background: #888; cursor: default; }

  .legend { font-size: 10px; display: flex; flex-direction: column; gap: 3px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 24px; height: 2px; display: inline-block; }
  .swatch.cut { background: #f44; }
  .swatch.fold-front { background: #f44; border-top: 1px dashed #f44; background: none; border-top: 2px dashed #f44; }
  .swatch.fold-back { background: none; border-top: 2px dashed #00f; }

  #zoom-row { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #aaa; }
  #zoom-row input { flex: 1; }
</style>
</head>
<body>

<div id="sidebar">
  <div>
    <h3>Box (mm)</h3>
  </div>
  <div class="field">
    <label>Width W</label>
    <input type="number" id="voxelW" value="30" min="1" max="150" step="1">
  </div>
  <div class="field">
    <label>Length L</label>
    <input type="number" id="voxelL" value="30" min="1" max="150" step="1">
  </div>
  <div class="field">
    <label>Height H</label>
    <input type="number" id="voxelH" value="30" min="1" max="150" step="1">
  </div>

  <div><h3>Marker</h3></div>
  <div class="field">
    <label>Start ID (0–1023)</label>
    <input type="number" id="markerId" value="48" min="0" max="1023" step="1">
  </div>
  <div class="field">
    <label>Size (mm)</label>
    <input type="number" id="markerSize" value="16" min="5" max="50" step="1">
  </div>
  <div class="field">
    <label>Repeat (1–4)</label>
    <input type="number" id="nRep" value="1" min="1" max="4" step="1">
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="markerPos">
    <label for="markerPos">Marker on H face</label>
  </div>

  <div><h3>View</h3></div>
  <div id="zoom-row">
    <span>Zoom</span>
    <input type="range" id="zoom" min="20" max="200" value="100" step="5">
    <span id="zoomVal">100%</span>
  </div>

  <div><h3>Export</h3></div>
  <button id="btnExportSVG">Export cut SVG</button>
  <button id="btnExportCalib">Export calib SVG</button>
  <button id="btnPrint">Print / PDF</button>
  <div id="status"></div>

  <div><h3>Legend</h3></div>
  <div class="legend">
    <div class="legend-item"><span class="swatch cut"></span>Cut line</div>
    <div class="legend-item"><span class="swatch fold-front"></span>Front fold</div>
    <div class="legend-item" style="color:#88f"><span class="swatch fold-back"></span>Back fold</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="mainCanvas"></canvas>
</div>

let startIndex = 48, markerSize = 16, nRep = 1, markerPos = false;
let zoomPct = 100;

// ─── Grid params ──────────────────────────────────────────────────────────────
// unitW = unitL = unitH = 1 (fixed)
// xpos[6]: [0, H, H+W, 2H+W, 2H+2W, 3H+2W]
// ypos[4]: [0, H, H+L, 2H+L]
function computeGrid(MM_I) {
  const W = voxelW * MM_I, L = voxelL * MM_I, H = voxelH * MM_I;
  const xpos = [0, H, H+W, 2*H+W, 2*H+2*W, 3*H+2*W];
  const ypos = [0, H, H+L, 2*H+L];
  const thickMM  = 0.5  * MM_I;
  const offsetMM = 3.0  * MM_I;
  const dashLen  = 3.0  * MM_I;
  const gapLen   = 3.0  * MM_I;
  return { xpos, ypos, thickMM, offsetMM, dashLen, gapLen };
}

// ─── Drawing helpers ──────────────────────────────────────────────────────────
function dashedLine(ctx, x1, y1, x2, y2, dash, gap) {
  const total = Math.hypot(x2 - x1, y2 - y1);
  if (total <= 2 * gap) return;
  const dx = (x2 - x1) / total, dy = (y2 - y1) / total;
  let pos = gap;
  ctx.beginPath();
  while (pos < total - gap) {
    ctx.moveTo(x1 + dx * pos, y1 + dy * pos);
    const end = Math.min(pos + dash, total - gap);
    ctx.lineTo(x1 + dx * end, y1 + dy * end);
    pos += dash + gap;
  }
  ctx.stroke();
}

function solidLine(ctx, x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// ─── Pattern drawing ──────────────────────────────────────────────────────────
function drawBackFold(ctx, g) {
  const { xpos: x, ypos: y, dashLen, gapLen } = g;
  const n = x.length - 1, m = y.length - 1;
  // Four diagonal lines at inner corners
  dashedLine(ctx, x[0], y[0], x[1], y[1], dashLen, gapLen);
  dashedLine(ctx, x[3], y[0], x[2], y[1], dashLen, gapLen);
  dashedLine(ctx, x[0], y[m], x[1], y[m-1], dashLen, gapLen);
  dashedLine(ctx, x[3], y[m], x[2], y[m-1], dashLen, gapLen);
}

function drawFrontFold(ctx, g) {
  const { xpos: x, ypos: y, thickMM: t, dashLen, gapLen } = g;
  const n = x.length - 1, m = y.length - 1;
  // Vertical fold lines
  dashedLine(ctx, x[1], y[0],   x[1], y[m],   dashLen, gapLen);
  dashedLine(ctx, x[2], y[0],   x[2], y[m],   dashLen, gapLen);
  dashedLine(ctx, x[3], y[1],   x[3], y[m-1], dashLen, gapLen);
  dashedLine(ctx, x[4]-t, y[1]+t, x[4]-t, y[m-1]-t, dashLen, gapLen);
  // Horizontal fold lines
  dashedLine(ctx, x[0], y[1],   x[3],     y[1],   dashLen, gapLen);
  dashedLine(ctx, x[3], y[1]+t, x[n-1]-t, y[1]+t, dashLen, gapLen);
  dashedLine(ctx, x[0], y[m-1], x[3],     y[m-1], dashLen, gapLen);
  dashedLine(ctx, x[3], y[m-1]-t, x[n-1]-t, y[m-1]-t, dashLen, gapLen);
}

function drawFrontCut(ctx, g) {
  const { xpos: x, ypos: y, thickMM: t, offsetMM: off } = g;
  const n = x.length - 1, m = y.length - 1;

  // Left full edge
  solidLine(ctx, x[0], y[0], x[0], y[m]);

  // Right small tab edge
  solidLine(ctx, x[n]-2*t, y[1]+off+t, x[n]-2*t, y[m-1]-off-t);

  // Top: left portion + right flap
  solidLine(ctx, x[0],     y[0],   x[3],         y[0]);
  solidLine(ctx, x[3]+off, y[0]+t, x[4]-off-t,   y[0]+t);

  // Bottom: left portion + right flap
  solidLine(ctx, x[0],     y[m],   x[3],         y[m]);
  solidLine(ctx, x[3]+off, y[m]-t, x[4]-off-t,   y[m]-t);

  // Vertical segment at x[3] (top and bottom gaps)
  solidLine(ctx, x[3], y[0],     x[3], y[1]+t);
  solidLine(ctx, x[3], y[m-1]-t, x[3], y[m]);

  // Diagonal corner cuts (top-right flap)
  solidLine(ctx, x[4]-off-t, y[0]+t, x[4]-t, y[1]+t);
  solidLine(ctx, x[4]-off-t, y[m]-t, x[4]-t, y[m-1]-t);

  // Diagonal taper to tab (right side)
  solidLine(ctx, x[4]-t, y[1]+t,   x[n]-2*t, y[1]+off+t);
  solidLine(ctx, x[4]-t, y[m-1]-t, x[n]-2*t, y[m-1]-off-t);

  // Short diagonal at x[3] top/bottom
  solidLine(ctx, x[3]+off, y[0]+t, x[3], y[1]+t);
  solidLine(ctx, x[3]+off, y[m]-t, x[3], y[m-1]-t);
}

// ─── Marker drawing ───────────────────────────────────────────────────────────
function drawMarker(ctx, markerId, markerSizePx) {
  // markerSizePx = Marker_Size * MM  (the "inner" size; actual = * 9/7)
  const actual = markerSizePx * (9 / 7);
  const cell   = actual / 9;
  // Packed bits: bit (24 - x*5 - y) = payload[x][y], x=col, y=row within 5×5
  const packed = ARUCO_DATA[Math.max(0, Math.min(1023, markerId))] >>> 0;

  ctx.save();
  for (let pi = 0; pi < 9; pi++) {
    for (let pj = 0; pj < 9; pj++) {
      let fill;
      if (pi === 0 || pi === 8 || pj === 0 || pj === 8) {
        fill = '#fff';  // outer quiet zone
      } else if (pi === 1 || pi === 7 || pj === 1 || pj === 7) {
        fill = '#000';  // black border
      } else {
        // inner 5×5: payload[pi-2][pj-2] → bit at position (pi-2)*5+(pj-2) from MSB
        const bit = (packed >> (24 - (pi - 2) * 5 - (pj - 2))) & 1;
        fill = bit ? '#fff' : '#000';
      }
      ctx.fillStyle = fill;
      ctx.fillRect(Math.round(pi * cell), Math.round(pj * cell),
                   Math.ceil(cell), Math.ceil(cell));
    }
  }

  // ID label above marker
  ctx.fillStyle = '#000';
  ctx.font = `${Math.ceil(cell * 1.4)}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(String(markerId), actual / 2, 0);

  ctx.restore();
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  const canvas = document.getElementById('mainCanvas');
  const ctx    = canvas.getContext('2d');
  const scale  = zoomPct / 100;

  // A4 landscape dimensions in px (at MM px/mm)
  const pageW = Math.round(PRINT_W * MM * scale);
  const pageH = Math.round(PRINT_H * MM * scale);
  canvas.width  = pageW;
  canvas.height = pageH;

  // Background
  ctx.fillStyle = '#888';
  ctx.fillRect(0, 0, pageW, pageH);

  // White paper
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.fillRect(0, 0, pageW, pageH);

  ctx.save();
  ctx.scale(scale, scale);

  // Compute grid in print coords
  const g = computeGrid(MM);
  const { xpos, ypos, thickMM } = g;

  // Padding
  const padX = 15 * MM, padY = 15 * MM;

  // Bounding box of one pattern
  const bboxW = xpos[xpos.length - 1] - thickMM * 2 - xpos[0];
  const bboxH = ypos[ypos.length - 1] - ypos[0];

  // Calibration crosses (grey)
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 0.5;
  drawCalibCrosses(ctx);

  // Pattern(s)
  ctx.save();
  ctx.translate(padX, padY);

  for (let i = 0; i < nRep; i++) {
    ctx.save();
    ctx.translate((i % 2) * bboxW, Math.floor(i / 2) * bboxH);

    // Back fold: blue dashed
    ctx.strokeStyle = '#00f';
    ctx.lineWidth = 0.8;
    drawBackFold(ctx, g);

    // Front fold: red dashed
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 0.8;
    drawFrontFold(ctx, g);

    // Cut lines: red solid
    ctx.strokeStyle = '#f00';
    ctx.lineWidth = 1;
    drawFrontCut(ctx, g);

    // Marker (print only, not cut)
    const m = ypos.length - 1;
    let centerX = (xpos[1] + xpos[2]) / 2;
    if (markerPos) centerX = (xpos[3] + xpos[2]) / 2;
    const centerY = (ypos[1] + ypos[m - 1]) / 2;
    const mkrPx   = markerSize * MM;
    const mkrActual = mkrPx * (9 / 7);
    ctx.save();
    ctx.translate(centerX - mkrActual / 2, centerY - mkrActual / 2);
    drawMarker(ctx, startIndex + i, mkrPx);
    ctx.restore();

    ctx.restore();
  }

  ctx.restore(); // un-translate padding
  ctx.restore(); // un-scale
}

function drawCalibCrosses(ctx) {
  // widthA4_C = VINYL_W*MM, heightA4_C = VINYL_H*MM (Processing globals)
  // All coordinates are in pixels, matching Processing's line(x*MM, y*MM, ...) calls.
  const w = VINYL_W * MM, h = VINYL_H * MM;
  solidLine(ctx, 10*MM,   5*MM,  10*MM,  15*MM);
  solidLine(ctx,  5*MM,  10*MM,  15*MM,  10*MM);
  solidLine(ctx, w-10*MM, 5*MM,  w-10*MM, 15*MM);
  solidLine(ctx, w- 5*MM, 10*MM, w-15*MM, 10*MM);
  solidLine(ctx, 10*MM,  h- 5*MM, 10*MM,  h-15*MM);
  solidLine(ctx,  5*MM,  h-10*MM, 15*MM,  h-10*MM);
  solidLine(ctx, w-10*MM, h- 5*MM, w-10*MM, h-15*MM);
  solidLine(ctx, w- 5*MM, h-10*MM, w-15*MM, h-10*MM);
}

// ─── SVG Export ───────────────────────────────────────────────────────────────
function toSVGLine(x1, y1, x2, y2, stroke, sw, dashed) {
  const dashAttr = dashed ? ` stroke-dasharray="3,3"` : '';
  return `<line x1="${x1.toFixed(3)}" y1="${y1.toFixed(3)}" x2="${x2.toFixed(3)}" y2="${y2.toFixed(3)}" stroke="${stroke}" stroke-width="${sw}"${dashAttr}/>`;
}

function svgAnchor(x, y) {
  // Matches Processing's point() in SVG mode: tiny filled circle
  return `<circle cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r="0.5" fill="#000" stroke="none"/>`;
}

function buildSVGLines() {
  // Use vinyl coords for the cut SVG (matching Processing's SVG export)
  const g = computeGrid(MM_V);
  const { xpos, ypos, thickMM, offsetMM } = g;
  const padX = 15 * MM_V, padY = 15 * MM_V;
  const bboxW = xpos[xpos.length-1] - thickMM*2 - xpos[0];
  const bboxH = ypos[ypos.length-1] - ypos[0];
  const vW = VINYL_W * MM_V, vH = VINYL_H * MM_V;

  // Anchors at canvas corners (drawAnchors_V, before any translate)
  let lines = [
    svgAnchor(0, 0), svgAnchor(vW, 0), svgAnchor(0, vH), svgAnchor(vW, vH),
  ];

  function addDashed(x1, y1, x2, y2, dx, dy, stroke) {
    // Collect dashed segments
    const total = Math.hypot(x2-x1, y2-y1);
    const dl = 3 * MM_V, gl = 3 * MM_V;
    if (total <= 2*gl) return;
    let pos = gl;
    while (pos < total - gl) {
      const sx = x1 + dx*pos, sy = y1 + dy*pos;
      const ep = Math.min(pos + dl, total - gl);
      lines.push(toSVGLine(sx+padX, sy+padY, x1+dx*ep+padX, y1+dy*ep+padY, stroke, 0.5, false));
      pos += dl + gl;
    }
  }

  for (let i = 0; i < nRep; i++) {
    const ox = (i % 2) * bboxW, oy = Math.floor(i / 2) * bboxH;
    const x = xpos.map(v => v + ox), y = ypos.map(v => v + oy);
    const n = x.length-1, m = y.length-1;
    const t = thickMM, off = offsetMM;

    function dline(x1,y1,x2,y2, stroke) {
      const tot = Math.hypot(x2-x1,y2-y1);
      if (tot < 1e-6) return;
      const dx=(x2-x1)/tot, dy=(y2-y1)/tot;
      addDashed(x1,y1,x2,y2,dx,dy,stroke);
    }
    function sline(x1,y1,x2,y2) {
      lines.push(toSVGLine(x1+padX, y1+padY, x2+padX, y2+padY, '#000', 0.5, false));
    }

    // Back fold (blue → black in SVG)
    dline(x[0],y[0],x[1],y[1],'#000');
    dline(x[3],y[0],x[2],y[1],'#000');
    dline(x[0],y[m],x[1],y[m-1],'#000');
    dline(x[3],y[m],x[2],y[m-1],'#000');

    // Front fold (red → black dashed)
    dline(x[1],y[0],x[1],y[m],'#000');
    dline(x[2],y[0],x[2],y[m],'#000');
    dline(x[3],y[1],x[3],y[m-1],'#000');
    dline(x[4]-t,y[1]+t,x[4]-t,y[m-1]-t,'#000');
    dline(x[0],y[1],x[3],y[1],'#000');
    dline(x[3],y[1]+t,x[n-1]-t,y[1]+t,'#000');
    dline(x[0],y[m-1],x[3],y[m-1],'#000');
    dline(x[3],y[m-1]-t,x[n-1]-t,y[m-1]-t,'#000');

    // Cut lines (solid)
    sline(x[0],y[0],x[0],y[m]);
    sline(x[n]-2*t,y[1]+off+t,x[n]-2*t,y[m-1]-off-t);
    sline(x[0],y[0],x[3],y[0]);
    sline(x[3]+off,y[0]+t,x[4]-off-t,y[0]+t);
    sline(x[0],y[m],x[3],y[m]);
    sline(x[3]+off,y[m]-t,x[4]-off-t,y[m]-t);
    sline(x[3],y[0],x[3],y[1]+t);
    sline(x[3],y[m-1]-t,x[3],y[m]);
    sline(x[4]-off-t,y[0]+t,x[4]-t,y[1]+t);
    sline(x[4]-off-t,y[m]-t,x[4]-t,y[m-1]-t);
    sline(x[4]-t,y[1]+t,x[n]-2*t,y[1]+off+t);
    sline(x[4]-t,y[m-1]-t,x[n]-2*t,y[m-1]-off-t);
    sline(x[3]+off,y[0]+t,x[3],y[1]+t);
    sline(x[3]+off,y[m]-t,x[3],y[m-1]-t);
  }

  return lines;
}

function exportCalibSVG() {
  // Anchor points at canvas corners + calibration crosses symmetric at 10mm from each corner,
  // matching drawCalibCrosses() (print version) translated to vinyl coords (MM_V).
  // Physical size in mm; viewBox uses MM_V internal units.
  const vW = VINYL_W * MM_V;  // internal width  (user units)
  const vH = VINYL_H * MM_V;  // internal height (user units)

  // L takes coordinates in mm, converts to SVG user units
  function L(x1mm, y1mm, x2mm, y2mm) {
    return `<line x1="${(x1mm*MM_V).toFixed(3)}" y1="${(y1mm*MM_V).toFixed(3)}" x2="${(x2mm*MM_V).toFixed(3)}" y2="${(y2mm*MM_V).toFixed(3)}" stroke="#000" stroke-width="0.5"/>`;
  }

  // Cross centers at 10mm from each corner (symmetric, matching print calib):
  // TL:(10,10)  TR:(270,10)  BL:(10,190)  BR:(270,190)  — arms ±5mm from center
  const W = VINYL_W, H = VINYL_H;
  const lines = [
    // Anchors at canvas corners (drawAnchors_V)
    svgAnchor(0, 0), svgAnchor(vW, 0), svgAnchor(0, vH), svgAnchor(vW, vH),
    // TL cross  center (10, 10)
    L(10,  5, 10, 15),  L( 5, 10, 15, 10),
    // TR cross  center (W-10, 10)
    L(W-10,  5, W-10, 15),  L(W-15, 10, W-5, 10),
    // BL cross  center (10, H-10)
    L(10, H-15, 10, H-5),  L( 5, H-10, 15, H-10),
    // BR cross  center (W-10, H-10)
    L(W-10, H-15, W-10, H-5),  L(W-15, H-10, W-5, H-10),
  ];

  const svg = [
    `<?xml version="1.0" encoding="UTF-8"?>`,
    `<svg xmlns="http://www.w3.org/2000/svg" width="${VINYL_W}mm" height="${VINYL_H}mm" viewBox="0 0 ${vW.toFixed(3)} ${vH.toFixed(3)}">`,
    ...lines,
    `</svg>`
  ].join('\n');

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `calib_f_${Date.now()}.svg`;
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('status').textContent = 'Calib SVG exported.';
}

function exportSVG() {
  const vW = VINYL_W * MM_V;  // internal width  (user units)
  const vH = VINYL_H * MM_V;  // internal height (user units)
  const lines = buildSVGLines();
  const svg = [
    `<?xml version="1.0" encoding="UTF-8"?>`,
    `<svg xmlns="http://www.w3.org/2000/svg" width="${VINYL_W}mm" height="${VINYL_H}mm" viewBox="0 0 ${vW.toFixed(3)} ${vH.toFixed(3)}">`,
    ...lines,
    `</svg>`
  ].join('\n');

  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `res_f_${Date.now()}.svg`;
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('status').textContent = 'SVG exported.';
}

// ─── UI wiring ────────────────────────────────────────────────────────────────
function bindInputs() {
  function num(id, setter) {
    document.getElementById(id).addEventListener('input', e => {
      setter(parseFloat(e.target.value));
      render();
    });
  }
  num('voxelW',    v => voxelW     = v);
  num('voxelL',    v => voxelL     = v);
  num('voxelH',    v => voxelH     = v);
  num('markerId',  v => startIndex = Math.round(v));
  num('markerSize',v => markerSize = v);
  num('nRep',      v => nRep       = Math.max(1, Math.min(4, Math.round(v))));

  document.getElementById('markerPos').addEventListener('change', e => {
    markerPos = e.target.checked;
    render();
  });

  document.getElementById('zoom').addEventListener('input', e => {
    zoomPct = parseInt(e.target.value);
    document.getElementById('zoomVal').textContent = zoomPct + '%';
    render();
  });

  document.getElementById('btnExportSVG').addEventListener('click', exportSVG);
  document.getElementById('btnExportCalib').addEventListener('click', exportCalibSVG);
  document.getElementById('btnPrint').addEventListener('click', () => {
    // Re-render at zoom=100 so canvas pixels map 1:1 to the @page dimensions,
    // then restore the user's zoom after the print dialog closes.
    const saved = zoomPct;
    zoomPct = 100;
    render();
    window.print();
    zoomPct = saved;
    render();
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
bindInputs();
render();
</script>
